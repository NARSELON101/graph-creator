{% extends 'base.html' %}
{% block content %}
    <div class="container">
        <div class="row">
            {% for dataset in datasets %}
              <div class="col-6 p-2">
                <div class="card">
                  <div class="card-body">
                    <h5 class="card-title">{{ dataset.name }}</h5>
                    <a href="{{ dataset.get_absolute_url }}" class="btn btn-primary">Открыть</a>
                  </div>
                </div>
              </div>
            {% endfor %}
        </div>
    </div>
{% endblock %}
